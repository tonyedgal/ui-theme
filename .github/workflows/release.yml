name: CI & Release

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect browser changes
        id: browser
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "vue=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_files=$(git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA")
          shared='^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json|\.github/workflows/(release|full-validation)\.yml)$'
          web='^(packages/ui-theme/|apps/examples/example-(next|tanstack|tanstack-ssr)/)'
          vue='^(packages/ui-theme-vue/|packages/ui-theme/src/core/|packages/ui-theme/package\.json$|apps/examples/(example-vue|example-nuxt|vue-theme-demo)/)'
          for target in web vue; do
            pattern=${!target}
            if grep -Eq "$shared|$pattern" <<< "$changed_files"; then
              echo "$target=true" >> "$GITHUB_OUTPUT"
            else
              echo "$target=false" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Check packages
        run: pnpm exec turbo run build typecheck --filter='./packages/*'

      - name: Check affected workspaces
        run: pnpm exec turbo run build typecheck --affected

      - name: Build Vue browser examples
        if: steps.browser.outputs.vue == 'true'
        run: pnpm exec turbo run build --filter=example-vue --filter=example-nuxt

      - name: Unit and declaration tests
        run: pnpm --filter uitheme-web test && pnpm --filter uitheme-web test:types

      - name: Native theme behavior tests
        run: pnpm --filter uitheme-rn test

      - name: Packed package tests
        run: pnpm --filter uitheme-web test:package

      - name: Vue packed package checks
        run: pnpm --filter uitheme-vue test:package

      - name: Native packed package tests
        run: pnpm --filter uitheme-rn test:package

      - name: Web browser checks
        if: steps.browser.outputs.web == 'true'
        env:
          PLAYWRIGHT_CHANNEL: chrome
        run: pnpm --filter uitheme-web test:browser --project=chromium-dpr2

      - name: Vue and Nuxt browser checks
        if: steps.browser.outputs.vue == 'true'
        env:
          PLAYWRIGHT_CHANNEL: chrome
        run: pnpm --filter uitheme-vue test:browser --project=chromium --project=mobile

      - name: Save browser evidence
        if: failure() && (steps.browser.outputs.web == 'true' || steps.browser.outputs.vue == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          retention-days: 7
          path: |
            packages/ui-theme/test-results
            packages/ui-theme-vue/playwright-report
            packages/ui-theme-vue/test-results

      - name: Production dependency audit
        id: dependency-audit
        continue-on-error: true
        run: pnpm audit --prod

      - name: Report dependency audit findings
        if: always() && steps.dependency-audit.outcome == 'failure'
        run: |
          echo "::warning::The production dependency audit reported findings or could not complete. Review the audit log. This check is advisory."
          echo "### Dependency audit" >> "$GITHUB_STEP_SUMMARY"
          echo "The production audit reported findings or could not complete. See the audit step for details. The audit is advisory; build, type, and test checks remain required." >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup npm 11.x
        run: |
          npm install -g npm@11
          npm --version

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset:publish
          version: pnpm changeset:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

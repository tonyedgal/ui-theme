name: CI & Release

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      retry_release:
        description: Retry publishing current package versions
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      release-needed: ${{ steps.validation.outputs.release }}
      pending-changesets: ${{ steps.changesets.outputs.pending }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: ${{ runner.os }}-products-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-products-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Validate affected packages and website
        id: validation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/validate.mjs --ci ${{ inputs.retry_release && '--release' || '' }}

      - name: Save validation plan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-plan
          retention-days: 7
          path: test-results/validation-plan.json

      # Pending changesets mean the next release step opens the version pull
      # request. No pending changesets mean the version pull request merged and
      # the packages are ready to publish.
      - name: Find pending changesets
        id: changesets
        run: |
          pending=false
          for file in .changeset/*.md; do
            if [ -f "$file" ] && [ "$(basename "$file")" != "README.md" ]; then
              pending=true
              break
            fi
          done
          # After `changeset pre exit`, the changesets for the final versions
          # are in .changeset/pre/ and not in .changeset/.
          if [ -f .changeset/pre.json ] && grep -q '"mode": *"exit"' .changeset/pre.json; then
            for file in .changeset/pre/*.md; do
              if [ -f "$file" ]; then
                pending=true
                break
              fi
            done
          fi
          echo "pending=$pending" >> "$GITHUB_OUTPUT"

  version:
    name: Version pull request
    needs: ci
    if: github.repository_owner == 'tonyedgal' && github.ref == 'refs/heads/main' && needs.ci.outputs.pending-changesets == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Setup npm 11.x
        run: |
          npm install -g npm@11
          npm --version

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update the version pull request
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset:version

  pack:
    name: Pack packages
    needs: ci
    if: github.repository_owner == 'tonyedgal' && github.ref == 'refs/heads/main' && needs.ci.outputs.release-needed == 'true' && needs.ci.outputs.pending-changesets == 'false' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      # pnpm pack does not run prepublishOnly, so the package smoke tests run here.
      - name: Test packed packages
        run: |
          pnpm --filter uitheme-web test:package
          pnpm --filter uitheme-cli test:package
          pnpm --filter uitheme-rn test:package

      - name: Pack packages
        id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  publish:
    name: Publish to npm
    needs: [ci, pack]
    if: github.repository_owner == 'tonyedgal' && github.ref == 'refs/heads/main' && needs.ci.outputs.release-needed == 'true' && needs.ci.outputs.pending-changesets == 'false' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    # The npm environment holds the publish job until a maintainer approves it.
    environment: npm
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Setup npm 11.21.1
        run: |
          npm install -g npm@11.21.1
          npm --version

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # a script input makes the action ignore pack-dir-artifact-id.
      - name: Publish to npm
        id: changesets
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}

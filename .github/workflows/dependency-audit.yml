name: Advisory dependency audit

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.repository_owner == 'tonyedgal'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Audit lockfile
        id: audit
        continue-on-error: true
        run: pnpm audit --prod
      - name: Report findings
        if: always() && steps.audit.outcome == 'failure'
        run: |
          echo "::warning::Dependency audit reported findings or could not complete. Review the audit log."
          echo "The advisory dependency audit reported findings or could not complete. See the audit log." >> "$GITHUB_STEP_SUMMARY"

name: Full release validation

# Runs only after a maintainer approves it. On the version pull request, each
# new head waits in the `full-validation` environment until a reviewer starts
# it. Other pull requests skip the job, which counts as a passing check. A
# maintainer can also run it from the Actions tab on any branch.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: full-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Full validation
    if: github.repository_owner == 'tonyedgal' && (github.event_name == 'workflow_dispatch' || (github.head_ref == 'changeset-release/main' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: full-validation
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host --init
    # Firefox refuses to start as root when $HOME belongs to another user.
    # GitHub sets $HOME to /github/home, which the image gives to pwuser.
    env:
      HOME: /root
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate packages and website
        run: node scripts/validate.mjs --ci --all

      - name: Independent native release consumer
        run: node scripts/check-native-release-consumer.mjs

      - name: Independent Vue and Nuxt release consumer
        run: node scripts/check-vue-release-consumer.mjs

      - name: Independent emitted registry consumers
        run: node scripts/check-registry-release-consumers.mjs

      - name: shadcn registry consumer
        run: node scripts/check-registry-shadcn.mjs

      - name: Minimum versions of compatible dependencies
        run: node scripts/check-registry-minimum-dependencies.mjs

      - name: Full web browser matrix
        run: pnpm --filter uitheme-web test:browser

      - name: Vue and Nuxt browser matrix
        run: pnpm --filter uitheme-web test:browser:vue

      - name: Registry browser matrix
        run: pnpm --filter @ui-theme/registry test:browser

      - name: Website browser smoke
        run: pnpm --filter ui-theme-web test:browser

      - name: Save validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-validation-evidence
          retention-days: 7
          path: |
            packages/ui-theme/test-results
            packages/ui-theme/tests/vue-browser/test-results
            packages/ui-theme-registry/test-results
            apps/ui-theme-web/test-results
            test-results/release-consumers-native
            test-results/release-consumers-vue
            test-results/release-consumers-registry
            test-results/registry-shadcn
            test-results/registry-minimum-dependencies

packages:
  - packages/*
  - apps/*
  - apps/examples/*
  - examples/*
overrides:
  yaml@>=2.0.0 <2.8.3: 2.8.3
  esbuild@>=0.27.0 <0.28.1: 0.28.2
  # NativeWind 5 RC loads Metro's Lightning CSS and needs its 1.30 visitor AST.
  '@expo/metro-config@58.0.17>lightningcss': 1.30.1
  uuid@7.0.3: 11.1.1
  decode-uri-component@0.2.2: 0.5.0
minimumReleaseAge: 10080
allowBuilds:
  '@swc/core': true
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
